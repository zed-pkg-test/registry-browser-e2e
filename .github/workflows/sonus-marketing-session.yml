name: Sonus marketing session contract

on:
  push:
    branches:
      - agent/certify-sonus-marketing-session-20260810
  pull_request:
    paths:
      - .github/workflows/sonus-marketing-session.yml
      - .validation/sonus/**

permissions:
  contents: read

concurrency:
  group: sonus-marketing-session-${{ github.ref }}
  cancel-in-progress: true

env:
  # Exact reviewed head merged by sonus-auris/sonus-auris-web-server.rs#9.
  SONUS_SERVER_SHA: 0fcfb57616908603f6d1efb615ebcbfced8ed963
  SONUS_INTERFACES_SHA: 6a4984ea19bb31cd1af68a67c397efa9a8ce2d3a
  # Exact green head of sonus-auris/sonus-auris-site.web#26.
  SONUS_SITE_SHA: 8b5fab2798effeb613602e5988549b7e0029ea49

jobs:
  marketing-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: sonus-auris/sonus-auris-site.web
          ref: ${{ env.SONUS_SITE_SHA }}
          persist-credentials: false
      - name: Verify immutable site input
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SONUS_SITE_SHA"
      - name: Install dependencies
        run: npm ci
      - name: Run build and static contract suite
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser contract suite
        run: npm run test:e2e

  rust-session-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: validator
          persist-credentials: false
      - name: Fail closed unless pinned private sources are readable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          verify_commit_access() {
            local repository="$1"
            local sha="$2"
            local status
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${repository}/git/commits/${sha}")"
            if test "$status" != 200; then
              printf '::error title=Private source unavailable::%s@%s is not readable with this workflow token (HTTP %s). Certification stops before checkout; grant read access or run this workflow in an authorized Sonus repository.\n' \
                "$repository" "$sha" "$status"
              return 1
            fi
          }

          failures=0
          verify_commit_access sonus-auris/sonus-auris-web-server.rs "$SONUS_SERVER_SHA" || failures=1
          verify_commit_access sonus-auris/sonus-auris-interfaces "$SONUS_INTERFACES_SHA" || failures=1
          exit "$failures"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: sonus-auris/sonus-auris-web-server.rs
          ref: ${{ env.SONUS_SERVER_SHA }}
          path: sonus-auris-web-server.rs
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: sonus-auris/sonus-auris-interfaces
          ref: ${{ env.SONUS_INTERFACES_SHA }}
          path: sonus-auris-interfaces
          persist-credentials: false
      - name: Verify immutable Rust inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C sonus-auris-web-server.rs rev-parse HEAD)" = "$SONUS_SERVER_SHA"
          test "$(git -C sonus-auris-interfaces rev-parse HEAD)" = "$SONUS_INTERFACES_SHA"
      - name: Verify merged session source against reviewed fixtures
        working-directory: sonus-auris-web-server.rs
        shell: bash
        run: |
          set -euo pipefail
          cmp src/app/marketing_session.rs ../validator/.validation/sonus/marketing_session.rs
          cmp docs/marketing-session-contract.md ../validator/.validation/sonus/marketing-session-contract.md
          git grep -qF '.route("/auth/session/status", get(marketing_session::status))' -- src/app.rs
          git grep -qF '.route("/auth/session/refresh", post(marketing_session::refresh))' -- src/app.rs
          git grep -qF 'marketing_session::is_marketing_refresh' -- src/app.rs
          test -z "$(git status --porcelain)"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: sonus-auris-web-server.rs
      - name: Format, lint, and test exact source
        working-directory: sonus-auris-web-server.rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          test -z "$(git status --porcelain)"
          git diff --check
          ! grep -R -n -E '^(<<<<<<< .+|=======|>>>>>>> .+)$' --exclude-dir=.git .
          cargo metadata --locked --format-version 1 >/dev/null
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Stage exact tested source artifact
        working-directory: sonus-auris-web-server.rs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../sonus-session-artifact/src/app ../sonus-session-artifact/docs
          cp src/app.rs ../sonus-session-artifact/src/app.rs
          cp src/app/marketing_session.rs ../sonus-session-artifact/src/app/marketing_session.rs
          cp docs/marketing-session-contract.md ../sonus-session-artifact/docs/marketing-session-contract.md
          cp Cargo.lock ../sonus-session-artifact/Cargo.lock
          printf 'SONUS_SERVER_SHA=%s\nSONUS_INTERFACES_SHA=%s\n' \
            "$SONUS_SERVER_SHA" "$SONUS_INTERFACES_SHA" \
            > ../sonus-session-artifact/source-pins.env
          (cd ../sonus-session-artifact && sha256sum Cargo.lock src/app.rs src/app/marketing_session.rs docs/marketing-session-contract.md > SHA256SUMS)
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sonus-session-source
          path: sonus-session-artifact
          if-no-files-found: error
          retention-days: 7
