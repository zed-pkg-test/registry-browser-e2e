name: Marketing session contract

on:
  push:
    branches:
      - agent/certify-zed-marketing-session-20260810
  pull_request:
    paths:
      - .github/workflows/marketing-session-contract.yml

permissions:
  contents: read

concurrency:
  group: marketing-session-${{ github.ref }}
  cancel-in-progress: true

env:
  ZED_WEB_SERVER_SHA: 1fc1e2b413e522b125fcad011d3a6b7744c85ab5
  ZED_INTERFACES_SHA: 5394b2e7b070354ee79a4c6ac79c26d6264970cd

jobs:
  exact-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: zed-pkg/zed-web-server.rs
          ref: ${{ env.ZED_WEB_SERVER_SHA }}
          path: zed-web-server.rs
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ env.ZED_INTERFACES_SHA }}
          path: zed-interfaces
          persist-credentials: false
      - name: Verify immutable source graph
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C zed-web-server.rs rev-parse HEAD)" = "$ZED_WEB_SERVER_SHA"
          test "$(git -C zed-interfaces rev-parse HEAD)" = "$ZED_INTERFACES_SHA"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: zed-web-server.rs
      - name: Resolve committed dependency graph
        working-directory: zed-web-server.rs
        run: cargo metadata --locked --format-version 1 >/dev/null
      - name: Format exact source
        working-directory: zed-web-server.rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
      - name: Check and lint all targets
        working-directory: zed-web-server.rs
        run: |
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
      - name: Unit and documentation tests
        working-directory: zed-web-server.rs
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo test --locked
          cargo doc --locked --no-deps
      - name: Enforce token-blind cross-origin contract
        working-directory: zed-web-server.rs
        shell: bash
        run: |
          set -euo pipefail
          test -f src/marketing_session.rs
          test -f docs/marketing-session-contract.md
          git grep -qF 'https://zpkg.net' -- src/marketing_session.rs
          git grep -qF 'refreshAfterSeconds' -- src/marketing_session.rs public 2>/dev/null || git grep -qF 'refresh_after_seconds' -- src/marketing_session.rs
          git grep -qF 'ACCESS_CONTROL_ALLOW_CREDENTIALS' -- src/marketing_session.rs
          git grep -qF 'no-store, max-age=0' -- src/marketing_session.rs
          git grep -qF '/auth/session/status' -- src/routes/mod.rs
          git grep -qF '/auth/session/refresh' -- src/routes/mod.rs
          ! git grep -nE 'localStorage|sessionStorage' -- src/marketing_session.rs
          git diff --check
      - name: Stage exact formatted source artifact
        working-directory: zed-web-server.rs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../zed-marketing-session-artifact/src/routes ../zed-marketing-session-artifact/docs
          cp src/marketing_session.rs ../zed-marketing-session-artifact/src/marketing_session.rs
          cp src/lib.rs ../zed-marketing-session-artifact/src/lib.rs
          cp src/routes/mod.rs ../zed-marketing-session-artifact/src/routes/mod.rs
          cp docs/marketing-session-contract.md ../zed-marketing-session-artifact/docs/marketing-session-contract.md
          git diff --binary > ../zed-marketing-session-artifact/validated.patch
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zed-marketing-session-source
          path: zed-marketing-session-artifact
          if-no-files-found: error
          retention-days: 7
